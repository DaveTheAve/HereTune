name: Bug report
description: Something broke, lied, turned blue, or attempted interpretive dance.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please sanitize paths/logs before posting them. Do not upload private media."
  - type: input
    id: version
    attributes: {label: HereTune version, placeholder: "0.13.0"}
    validations: {required: true}
  - type: input
    id: heresphere
    attributes: {label: HereSphere version / platform, placeholder: "PC/Steam or Quest; version if known"}
  - type: input
    id: system
    attributes: {label: Windows / Python / FFmpeg, placeholder: "Windows 11, Python 3.12, FFmpeg ..."}
    validations: {required: true}
  - type: input
    id: hardware
    attributes: {label: CPU / GPU / RAM, placeholder: "CPU, NVIDIA/AMD GPU, RAM"}
  - type: dropdown
    id: mode
    attributes:
      label: Analysis mode
      options: [auto, hybrid, gpu, cpu, unknown]
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: What happened instead}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Sanitized logs / diagnostics, description: "Remove private paths, tokens, usernames, and anything you would not tattoo on a billboard."}
