name: CI

on:
  push:
  pull_request:

jobs:
  test-windows:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Python compilation
        run: python -m compileall heretune
      - name: JavaScript syntax
        run: |
          node --check heretune/static/app.js
          node --check heretune/static/player.js
      - name: Tests
        run: python -m pytest -q
      - name: Public-release hygiene
        run: python scripts/check_public_release.py

  package:
    name: Package release artifacts
    runs-on: windows-latest
    needs: test-windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Build release artifacts
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: heretune-release-artifacts
          path: dist-release/*

  required:
    name: CI required
    runs-on: ubuntu-latest
    needs: [test-windows, package]
    if: always()
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          test "${{ needs.test-windows.result }}" = "success"
          test "${{ needs.package.result }}" = "success"
